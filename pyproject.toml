[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "space-watch-core"
version = "0.2.0"
description = "Generic, offline comparison core for review-only observation candidates"
requires-python = ">=3.11"
dependencies = []
license = {text = "MIT"}

[project.optional-dependencies]
test = ["jsonschema>=4,<5"]

[tool.setuptools.packages.find]
where = ["src"]
